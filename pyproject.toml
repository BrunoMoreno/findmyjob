[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobsearch"
dynamic = ["version"]
description = "Busca de vagas via dorks em portais de emprego e ATS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bruno Moreno" }]
keywords = ["jobs", "vagas", "job-search", "ats", "indeed", "linkedin"]
dependencies = [
    "ddgs",
    "requests",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/BrunoMoreno/job-search"

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.hatch.version]
path = "src/jobsearch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
