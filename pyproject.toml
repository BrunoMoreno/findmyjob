[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobsearch"
version = "0.1.0"
description = "Busca de vagas via dorks em portais de emprego e ATS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Bruno Moreno" }]
keywords = ["jobs", "vagas", "job-search", "ats", "indeed", "linkedin"]
dependencies = [
    "ddgs",
    "requests",
    "openpyxl",
]

[project.urls]
Homepage = "https://github.com/BrunoMoreno/job-search"

[project.scripts]
jobsearch = "jobsearch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearch"]
