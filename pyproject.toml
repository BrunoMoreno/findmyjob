[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findmyjob"
dynamic = ["version"]
description = "Find jobs via dorks on job boards and Applicant Tracking Systems (ATS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bruno Moreno" }]
keywords = ["jobs", "job-search", "findmyjob", "ats", "indeed", "linkedin"]
dependencies = [
    "ddgs",
    "requests",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]
docs = [
    "mkdocs-material>=9",
]

[project.urls]
Homepage = "https://github.com/BrunoMoreno/findmyjob"
Repository = "https://github.com/BrunoMoreno/findmyjob"
Issues = "https://github.com/BrunoMoreno/findmyjob/issues"

[project.scripts]
findmyjob = "findmyjob.cli:main"

[tool.hatch.version]
path = "src/findmyjob/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/findmyjob"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
